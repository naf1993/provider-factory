services:
  mongo:
    image: mongo:7
    container_name: provider-factory-mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: provider-factory-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: provider-factory-app
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000

      RAW_MONGODB_URI: mongodb://mongo:27017/provider_raw
      DOMAIN_MONGODB_URI: mongodb://mongo:27017/provider_domain

      REDIS_HOST: redis
      REDIS_PORT: 6379

      FACTORY_BATCH_SIZE: 25
      FACTORY_CONCURRENCY: 5

    depends_on:
      mongo:
        condition: service_healthy

      redis:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: provider-factory-seed

    environment:
      RAW_MONGODB_URI: mongodb://mongo:27017/provider_raw

    depends_on:
      mongo:
        condition: service_healthy

    command:
      [
        "node",
        "dist/scripts/seed-raw.js"
      ]

    profiles:
      - tools

volumes:
  mongo_data:
  redis_data: